# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

# Overwrite or add rules to create your own house style
#
# # Use `[a, [b, c]]` not `[ a, [ b, c ] ]`
# Layout/SpaceInsideArrayLiteralBrackets:
#   Enabled: false

require:
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.4.1
  Exclude:
    - vendor/bundle/**/*
    - "**/db/schema.rb"
    - "**/db/**/*"
    - "config/**/*"
    - "bin/*"
    - "config.ru"
    - "Rakefile"

Style/Documentation:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Rails/Output:
  Enabled: false

Style/EmptyMethod:
  Enabled: false

Bundler/OrderedGems:
  Enabled: false

Lint/UnusedMethodArgument:
  Enabled: false

Style/FrozenStringLiteralComment:
  Enabled: false

Layout/LineLength:
  Max: 136

Metrics/MethodLength:
  Max: 16

Metrics/AbcSize:
  Max: 20

Lint/MissingSuper:
  Exclude:
    - "app/components/**/*"

Style/StringLiterals:
  EnforcedStyle: single_quotes
